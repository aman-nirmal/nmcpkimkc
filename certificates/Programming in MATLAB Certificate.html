/*************************************
 * Helper: Wait for MathWorksCountryCode to appear
 * - Polls briefly for Akamai-populated window.MathWorksCountryCode
 * - If not available within max wait, falls back to Launch DE
 *************************************/
function waitForCountryCode(onDone) {
  var tries = 0;
  var maxTries = 20;       // 20 * 100ms = 2000ms (2s) max wait
  var intervalMs = 100;

  var timer = setInterval(function () {
    try {
      var cc = window.MathWorksCountryCode;
      if (typeof cc === 'string' && cc.length > 0) {
        clearInterval(timer);
        try { _satellite.logger.info('Country code (MathWorks, delayed):', cc); } catch (e) {}
        onDone(cc);
        return;
      }
    } catch (err) {
      try { _satellite.logger.info('Error accessing MathWorksCountryCode (poll):', err); } catch (e) {}
    }

    tries++;
    if (tries >= maxTries) {
      clearInterval(timer);
      try { _satellite.logger.info('MathWorksCountryCode not available within timeout; using Launch DE fallback'); } catch (e) {}
      onDone(null);
    }
  }, intervalMs);
}
